<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Record Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1db954;
      --bg:    #0a0a0a;
      --card:  #111111;
      --border:#1c1c1c;
      --text:  #ffffff;
      --muted: #aaaaaa;
      --dim:   #555555;
    }

    html { max-width: 100vw; overflow-x: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      height: 100dvh;
      max-width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── Auth screen ── */
    #auth-screen {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 40px;
      text-align: center;
    }
    #auth-screen h1 { font-size: 42px; font-weight: 700; letter-spacing: -0.5px; }
    #auth-screen p  { color: var(--muted); font-size: 24px; line-height: 1.5; max-width: 380px; }
    #connect-btn {
      margin-top: 8px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 500px;
      padding: 16px 44px;
      font-size: 27px;
      font-weight: 700;
      cursor: pointer;
    }
    #connect-btn:active { opacity: 0.85; }

    /* ── Main UI ── */
    #main-ui {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* ── Pages outer ── */
    #pages-outer {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    /* ── Pages track (3× wide) ── */
    #pages {
      display: flex;
      width: 300%;
      height: 100%;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Individual pages ── */
    #page-player, #page-playlists, #page-search {
      width: 33.333%;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Page dots ── */
    #page-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      height: 32px;
      flex-shrink: 0;
      padding-bottom: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dim);
      cursor: pointer;
      transition: background 0.2s;
    }
    .dot.active { background: var(--green); }

    /* ── Now playing ── */
    #now-playing {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px 24px;
      background: var(--bg);
      flex: 1;
    }
    #album-art {
      width: 120px;
      height: 120px;
      border-radius: 8px;
      background: #1a1a1a;
      object-fit: cover;
      flex-shrink: 0;
    }
    #track-info { flex: 1; min-width: 0; }
    #track-name {
      font-size: 33px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #track-artist {
      font-size: 24px;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #track-album {
      font-size: 21px;
      color: var(--dim);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Progress ── */
    #progress-section {
      padding: 10px 24px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #progress-track {
      width: 100%;
      height: 4px;
      background: #2a2a2a;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    #progress-track::after {
      content: '';
      position: absolute;
      inset: -10px 0;
    }
    #progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 2px;
      width: 0%;
      transition: width 1s linear;
      pointer-events: none;
    }
    #progress-times {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      color: var(--dim);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Controls ── */
    #controls {
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding: 14px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ctrl {
      background: none;
      border: none;
      color: var(--dim);
      cursor: pointer;
      padding: 12px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, transform 0.1s, color 0.15s;
    }
    .ctrl:active { background: #222; transform: scale(0.92); }
    .ctrl.primary {
      width: 68px;
      height: 68px;
      background: var(--green);
      color: #fff;
      padding: 0;
    }
    .ctrl.primary:active { background: #18a348; }
    .ctrl.nav { color: var(--text); }
    .ctrl.active { color: var(--green); }
    .ctrl svg { display: block; }

    /* Keyboard/encoder focus highlight */
    :focus-visible { outline: none; background-color: #2a2a2a; border-radius: 6px; }
    .ctrl:focus-visible { border-radius: 50%; background-color: #2a2a2a; }

    /* Repeat badge "1" */
    #repeat-wrap { position: relative; display: flex; }
    #repeat-badge {
      position: absolute;
      top: -3px;
      right: -4px;
      font-size: 15px;
      font-weight: 700;
      color: var(--green);
      line-height: 1;
      display: none;
    }

    /* ── Queue section (player page — 1 item only) ── */
    #queue-section {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    #queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 10px 24px;
      flex-shrink: 0;
    }
    #queue-label {
      font-size: 18px;
      font-weight: 700;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    #volume-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .vol-icon { color: var(--dim); flex-shrink: 0; }
    input[type=range] {
      -webkit-appearance: none;
      width: 130px;
      min-width: 0;
      height: 4px;
      border-radius: 2px;
      background: #2a2a2a;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 0; height: 0; opacity: 0; display: none;
    }
    input[type=range]::-moz-range-thumb {
      width: 0; height: 0; opacity: 0; border: none;
    }
    #queue-scroll {
      flex: 1;
      overflow: hidden;
    }
    .queue-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px 10px 24px;
    }
    .queue-item img {
      width: 52px;
      height: 52px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      background: #1a1a1a;
    }
    .queue-item-info { flex: 1; min-width: 0; }
    .queue-item-name {
      font-size: 24px;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-item-artist {
      font-size: 21px;
      color: var(--dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-item-dur {
      font-size: 21px;
      color: var(--dim);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .queue-empty {
      padding: 20px 24px;
      font-size: 23px;
      color: var(--dim);
    }

    /* ── Playlists page ── */
    #pl-pages {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #pl-list-view, #pl-tracks-view {
      width: 50%;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #pl-list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-content: start;
    }
    #pl-list-scroll::-webkit-scrollbar { display: none; }
    .pl-card {
      background: var(--card);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      min-width: 0;
      border: 1px solid var(--border);
    }
    .pl-card:active { background: #1a1a1a; }
    .pl-card img {
      width: 64px;
      height: 64px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: #1a1a1a;
    }
    .pl-card-info { flex: 1; min-width: 0; }
    .pl-card-name {
      font-size: 23px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pl-card-count { font-size: 18px; color: var(--dim); margin-top: 3px; }
    .liked-card { grid-column: 1 / -1; }
    .liked-art {
      width: 64px;
      height: 64px;
      border-radius: 6px;
      background: linear-gradient(135deg, #450af5 0%, #8e44ad 50%, #c4efd9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 30px;
    }
    #pl-spinner {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dim);
      font-size: 24px;
    }
    #pl-tracks-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #pl-back-btn {
      background: none;
      border: none;
      color: var(--green);
      cursor: pointer;
      padding: 4px 2px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    #pl-back-btn:active { opacity: 0.7; }
    #pl-tracks-title {
      flex: 1;
      min-width: 0;
      font-size: 27px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #pl-play-all-btn {
      background: var(--green);
      border: none;
      color: #fff;
      border-radius: 500px;
      padding: 8px 18px;
      font-size: 21px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    #pl-play-all-btn:active { background: #18a348; }
    #pl-tracks-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    #pl-tracks-scroll::-webkit-scrollbar { display: none; }
    #pl-tracks-spinner {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dim);
      font-size: 24px;
    }
    .track-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 16px;
      cursor: pointer;
    }
    .track-row:active { background: #161616; }
    .track-row img {
      width: 52px;
      height: 52px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      background: #1a1a1a;
    }
    .track-row-info { flex: 1; min-width: 0; }
    .track-row-name {
      font-size: 24px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-row-artist {
      font-size: 20px;
      color: var(--dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-row-dur {
      font-size: 20px;
      color: var(--dim);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ── Search page ── */
    #search-bar {
      padding: 12px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    #search-input {
      width: 100%;
      background: #1a1a1a;
      border: none;
      border-radius: 8px;
      color: var(--text);
      padding: 10px 16px;
      font-size: 27px;
      outline: none;
      font-family: inherit;
    }
    #search-input::placeholder { color: var(--dim); }
    #search-results {
      flex: 1;
      overflow-y: auto;
    }
    #search-results::-webkit-scrollbar { display: none; }
    .results-label {
      font-size: 18px;
      font-weight: 700;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 14px 16px 6px;
    }
    .result-track {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      cursor: pointer;
    }
    .result-track:active { background: #161616; }
    .result-track img {
      width: 52px;
      height: 52px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      background: #1a1a1a;
    }
    .result-track-info { flex: 1; min-width: 0; }
    .result-track-name {
      font-size: 24px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-track-artist {
      font-size: 20px;
      color: var(--dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-album {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      cursor: pointer;
    }
    .result-album:active { background: #161616; }
    .result-album img {
      width: 70px;
      height: 70px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: #1a1a1a;
    }
    .result-album-info { flex: 1; min-width: 0; }
    .result-album-name {
      font-size: 24px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-album-artist {
      font-size: 20px;
      color: var(--dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-empty {
      padding: 32px 16px;
      font-size: 23px;
      color: var(--dim);
      text-align: center;
    }
  </style>
</head>
<body>

<!-- Auth screen -->
<div id="auth-screen">
  <h1>Record Player</h1>
  <p>Connect your Spotify account to control playback.</p>
  <button id="connect-btn" onclick="location.href='/login'">Connect Spotify</button>
</div>

<!-- Main UI -->
<div id="main-ui">

  <!-- Pages outer -->
  <div id="pages-outer">
    <div id="pages">

      <!-- Page 0: Player -->
      <div id="page-player">

        <div id="now-playing">
          <img id="album-art" src="" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility=''">
          <div id="track-info">
            <div id="track-name">—</div>
            <div id="track-artist">—</div>
            <div id="track-album"></div>
          </div>
        </div>

        <div id="progress-section">
          <div id="progress-track" onclick="seek(event)">
            <div id="progress-fill"></div>
          </div>
          <div id="progress-times">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>

        <!-- Controls: shuffle | prev | play | next | repeat -->
        <div id="controls">
          <button class="ctrl" id="shuffle-btn" onclick="toggleShuffle()" aria-label="Shuffle">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
            </svg>
          </button>
          <button class="ctrl nav" onclick="skip('previous')" aria-label="Previous">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
            </svg>
          </button>
          <button class="ctrl primary" id="play-btn" onclick="togglePlay()" aria-label="Play/Pause">
            <svg id="play-icon" width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="pause-icon" width="34" height="34" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>
          <button class="ctrl nav" onclick="skip('next')" aria-label="Next">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/>
            </svg>
          </button>
          <button class="ctrl" id="repeat-btn" onclick="cycleRepeat()" aria-label="Repeat">
            <div id="repeat-wrap">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
              </svg>
              <span id="repeat-badge">1</span>
            </div>
          </button>
        </div>

        <!-- Queue (replaces Next Up) -->
        <div id="queue-section">
          <div id="queue-header">
            <span id="queue-label">Up Next</span>
            <div id="volume-section">
              <svg class="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
              <input type="range" id="vol-slider" min="0" max="88" value="48" step="4"
                     oninput="scheduleVolume(this.value)">
            </div>
          </div>
          <div id="queue-scroll"></div>
        </div>

      </div><!-- /page-player -->

      <!-- Page 1: Playlists -->
      <div id="page-playlists" inert>
        <div id="pl-pages">

          <div id="pl-list-view">
            <div id="pl-spinner">Loading playlists…</div>
            <div id="pl-list-scroll" style="display:none"></div>
          </div>

          <div id="pl-tracks-view">
            <div id="pl-tracks-header">
              <button id="pl-back-btn" onclick="showPlaylists()" aria-label="Back">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
              </button>
              <div id="pl-tracks-title">Playlist</div>
              <button id="pl-play-all-btn" onclick="playAll()">▶ Play All</button>
            </div>
            <div id="pl-tracks-spinner">Loading…</div>
            <div id="pl-tracks-scroll" style="display:none"></div>
          </div>

        </div>
      </div><!-- /page-playlists -->

      <!-- Page 2: Search -->
      <div id="page-search" inert>
        <div id="search-bar">
          <input id="search-input" type="text" placeholder="Search tracks, albums…"
                 oninput="onSearchInput()"
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div id="search-results">
          <div class="search-empty">Search for tracks or albums,<br>or swipe to browse playlists.</div>
        </div>
      </div><!-- /page-search -->

    </div><!-- /pages -->
  </div><!-- /pages-outer -->

  <!-- Page dots (3) -->
  <div id="page-dots">
    <div class="dot active" tabindex="0" onclick="goToPage(0)"></div>
    <div class="dot"        tabindex="0" onclick="goToPage(1)"></div>
    <div class="dot"        tabindex="0" onclick="goToPage(2)"></div>
  </div>

</div><!-- /main-ui -->

<script>
  // ── Encoder keyboard navigation ────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    // Enter on a focused div triggers its click (push to select)
    if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName === 'DIV') {
      document.activeElement.click();
      return;
    }

    // ArrowRight/Left: encoder rotation navigation (no browser default behavior to worry about)
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();

    // Determine the active focus container (accounts for playlist inner panel)
    let container;
    if (currentPage === 1) {
      const inTracks = el('pl-pages').style.transform === 'translateX(-50%)';
      container = el(inTracks ? 'pl-tracks-view' : 'pl-list-view');
    } else {
      container = el(pageIds[currentPage]);
    }

    // Page content + dots appended so encoder can always reach page switcher
    const inPage = [...container.querySelectorAll('button:not([disabled]), [tabindex="0"]')];
    const dots   = [...el('page-dots').querySelectorAll('[tabindex="0"]')];
    const focusable = [...inPage, ...dots];
    if (focusable.length === 0) return;

    const idx = focusable.indexOf(document.activeElement);
    if (e.key === 'ArrowLeft') {
      if (idx > 0) focusable[idx - 1].focus();
    } else {
      if (idx < focusable.length - 1) focusable[idx + 1].focus();
    }
  });

  // ── State ──────────────────────────────────────────────────────────────────
  let playing      = false;
  let progressMs   = 0;
  let durationMs   = 0;
  let tickTimer    = null;
  let shuffleState = false;
  let repeatState  = 'off';   // 'off' | 'context' | 'track'

  // Page state
  let currentPage         = 0;
  let playlistsLoaded     = false;
  let recentlyPlayedLoaded = false;
  let recentlyPlayedData  = [];
  let currentPlaylist     = null; // { id, uri, name }
  let currentTracks       = [];

  // ── Utilities ──────────────────────────────────────────────────────────────
  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function el(id) { return document.getElementById(id); }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function escStr(s) {
    return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  }

  function setProgress() {
    if (!durationMs) return;
    const pct = Math.min(progressMs / durationMs * 100, 100);
    el('progress-fill').style.width = pct + '%';
    el('time-current').textContent  = fmt(progressMs);
    el('time-total').textContent    = fmt(durationMs);
  }

  // ── Page navigation ────────────────────────────────────────────────────────
  const pageIds = ['page-player', 'page-playlists', 'page-search'];

  function goToPage(n) {
    currentPage = n;
    el('pages').style.transform = n === 0 ? '' : `translateX(${-n / 3 * 100}%)`;
    pageIds.forEach((id, i) => {
      const pg = el(id);
      if (i === n) {
        pg.removeAttribute('inert');
        // For playlists, scope focus to the visible inner panel, not the whole page
        let focusRoot = pg;
        if (n === 1) {
          const inTracks = el('pl-pages').style.transform === 'translateX(-50%)';
          focusRoot = el(inTracks ? 'pl-tracks-view' : 'pl-list-view');
        }
        const first = focusRoot.querySelector('button, [tabindex="0"]');
        if (first) first.focus();
      } else {
        pg.setAttribute('inert', '');
      }
    });
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === n));
    if (n === 1 && !playlistsLoaded) loadPlaylists();
    if (n === 2 && !recentlyPlayedLoaded) loadRecentlyPlayed();
  }

  // ── Swipe + drag-to-scroll ─────────────────────────────────────────────────
  // labwc mouseEmulation converts touch into pointer events, not scroll events,
  // so we implement scrolling manually by finding the nearest scrollable ancestor.
  (function () {
    const outer = el('pages-outer');
    let startX, startY, scrollEl, startScrollTop, didScroll;

    function findScrollable(node) {
      while (node && node !== outer) {
        const oy = window.getComputedStyle(node).overflowY;
        if ((oy === 'auto' || oy === 'scroll') && node.scrollHeight > node.clientHeight) return node;
        node = node.parentElement;
      }
      return null;
    }

    outer.addEventListener('pointerdown', e => {
      startX        = e.clientX;
      startY        = e.clientY;
      didScroll     = false;
      scrollEl      = findScrollable(e.target);
      startScrollTop = scrollEl ? scrollEl.scrollTop : 0;
    }, { passive: true });

    outer.addEventListener('pointermove', e => {
      if (!scrollEl) return;
      const dy = e.clientY - startY;
      const dx = e.clientX - startX;
      if (Math.abs(dy) > Math.abs(dx)) {          // clearly vertical
        scrollEl.scrollTop = startScrollTop - dy;
        didScroll = true;
      }
    }, { passive: true });

    outer.addEventListener('pointerup', e => {
      if (didScroll) { didScroll = false; return; } // don't swipe after a scroll
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0 && currentPage < 2) goToPage(currentPage + 1);
        if (dx > 0 && currentPage > 0) goToPage(currentPage - 1);
      }
    }, { passive: true });

    outer.addEventListener('pointercancel', () => { didScroll = false; scrollEl = null; });
  })();

  // ── Shuffle & Repeat ───────────────────────────────────────────────────────
  // Skip track — fire command, then poll at 300ms and 900ms (Spotify needs a moment)
  function skip(direction) {
    cmd(direction);
    pollAfterCmd(300);
    setTimeout(poll, 900);
  }

  function toggleShuffle() {
    shuffleState = !shuffleState;
    updateShuffleBtn();
    cmd('shuffle', { state: shuffleState });
    pollAfterCmd(400);
  }

  function updateShuffleBtn() {
    el('shuffle-btn').classList.toggle('active', shuffleState);
  }

  function cycleRepeat() {
    repeatState = { off: 'context', context: 'track', track: 'off' }[repeatState] || 'off';
    updateRepeatBtn();
    cmd('repeat', { state: repeatState });
    pollAfterCmd(400);
  }

  function updateRepeatBtn() {
    const on = repeatState !== 'off';
    el('repeat-btn').classList.toggle('active', on);
    el('repeat-badge').style.display = repeatState === 'track' ? '' : 'none';
  }

  // ── Queue ──────────────────────────────────────────────────────────────────
  function renderQueue(queue) {
    const scroll = el('queue-scroll');
    if (!queue || queue.length === 0) {
      scroll.innerHTML = '<div class="queue-empty">Nothing in queue</div>';
      return;
    }
    scroll.innerHTML = queue.slice(0, 1).map(t => `
      <div class="queue-item">
        <img src="${escHtml(t.art)}" alt=""
             onerror="this.style.visibility='hidden'" onload="this.style.visibility=''">
        <div class="queue-item-info">
          <div class="queue-item-name">${escHtml(t.name)}</div>
          <div class="queue-item-artist">${escHtml(t.artists)}</div>
        </div>
        <div class="queue-item-dur">${fmt(t.duration_ms)}</div>
      </div>
    `).join('');
  }

  // ── Commands ───────────────────────────────────────────────────────────────
  // Fire-and-forget — don't await the Pi→Spotify round-trip
  function cmd(action, body) {
    fetch(`/api/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : '{}',
    });
  }

  // Poll immediately then again after a short delay to catch Spotify propagation
  let _fastPollTimer = null;
  function pollAfterCmd(delayMs = 300) {
    clearTimeout(_fastPollTimer);
    _fastPollTimer = setTimeout(poll, delayMs);
  }

  function togglePlay() {
    const action = playing ? 'pause' : 'play';
    // Optimistic UI — flip immediately, poll corrects if needed
    playing = !playing;
    el('play-icon').style.display  = playing ? 'none' : '';
    el('pause-icon').style.display = playing ? '' : 'none';
    clearInterval(tickTimer); tickTimer = null;
    if (playing) tickTimer = setInterval(() => { progressMs += 1000; setProgress(); }, 1000);
    cmd(action);
    pollAfterCmd(500);
  }

  function setVolBg(v) {
    const pct = Math.round(v / 88 * 100);
    el('vol-slider').style.background =
      `linear-gradient(to right, var(--green) ${pct}%, #2a2a2a ${pct}%)`;
  }

  let _volTimer = null;
  function scheduleVolume(v) {
    setVolBg(v);
    clearTimeout(_volTimer);
    // Volume is ALSA-local — no need to re-poll after setting
    _volTimer = setTimeout(() => cmd('volume', { volume: parseInt(v) }), 300);
  }

  function seek(e) {
    if (!durationMs) return;
    const rect  = e.currentTarget.getBoundingClientRect();
    const pct   = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const posMs = Math.floor(pct * durationMs);
    progressMs  = posMs;
    setProgress();
    cmd('seek', { position_ms: posMs });
    pollAfterCmd(400);
  }

  // ── Playlists ──────────────────────────────────────────────────────────────
  async function loadPlaylists() {
    try {
      const r = await fetch('/api/playlists');
      const items = await r.json();
      playlistsLoaded = true;
      renderPlaylists(items);
    } catch {
      el('pl-spinner').textContent = 'Failed to load playlists.';
    }
  }

  function renderPlaylists(items) {
    el('pl-spinner').style.display = 'none';
    const scroll = el('pl-list-scroll');
    scroll.style.display = '';
    const likedCard = `
      <div class="pl-card liked-card" tabindex="0" onclick="openLikedSongs()">
        <div class="liked-art">♥</div>
        <div class="pl-card-info">
          <div class="pl-card-name">Liked Songs</div>
          <div class="pl-card-count" id="liked-count">Your library</div>
        </div>
      </div>`;
    scroll.innerHTML = likedCard + items.map(p => `
      <div class="pl-card" tabindex="0" onclick="openPlaylist('${escStr(p.id)}','${escStr(p.name)}')">
        <img src="${escHtml(p.art)}" alt=""
             onerror="this.style.visibility='hidden'" onload="this.style.visibility=''">
        <div class="pl-card-info">
          <div class="pl-card-name">${escHtml(p.name)}</div>
          <div class="pl-card-count">${p.tracks} tracks</div>
        </div>
      </div>
    `).join('');
  }

  let likedCollectionUri = '';

  async function openLikedSongs() {
    currentPlaylist = { id: '__liked__', uri: '', name: 'Liked Songs' };
    el('pl-tracks-title').textContent     = 'Liked Songs';
    el('pl-tracks-spinner').style.display = '';
    el('pl-tracks-spinner').textContent   = 'Loading…';
    el('pl-tracks-scroll').style.display  = 'none';
    el('pl-tracks-scroll').innerHTML      = '';
    el('pl-pages').style.transform        = 'translateX(-50%)';
    try {
      const r = await fetch('/api/liked-tracks');
      if (r.status === 401 || r.status === 403) {
        el('pl-tracks-spinner').textContent = 'Re-open /login to grant library access.';
        return;
      }
      const data = await r.json();
      likedCollectionUri   = data.collection_uri || '';
      currentPlaylist.uri  = likedCollectionUri;
      currentTracks        = data.tracks || [];
      el('pl-tracks-title').textContent = `Liked Songs (${data.total})`;
      const countEl = document.getElementById('liked-count');
      if (countEl) countEl.textContent = `${data.total} tracks`;
      renderTracks(currentTracks);
    } catch {
      el('pl-tracks-spinner').textContent = 'Failed to load liked songs.';
    }
  }

  async function openPlaylist(id, name) {
    currentPlaylist = { id, uri: `spotify:playlist:${id}`, name };
    el('pl-tracks-title').textContent     = name;
    el('pl-tracks-spinner').style.display = '';
    el('pl-tracks-spinner').textContent   = 'Loading…';
    el('pl-tracks-scroll').style.display  = 'none';
    el('pl-tracks-scroll').innerHTML      = '';
    el('pl-pages').style.transform        = 'translateX(-50%)';
    try {
      const r = await fetch(`/api/playlist/${id}/tracks`);
      currentTracks = await r.json();
      renderTracks(currentTracks);
    } catch {
      el('pl-tracks-spinner').textContent = 'Failed to load tracks.';
    }
  }

  function renderTracks(tracks) {
    el('pl-tracks-spinner').style.display = 'none';
    const scroll = el('pl-tracks-scroll');
    scroll.style.display = '';
    scroll.innerHTML = tracks.map((t, i) => `
      <div class="track-row" tabindex="0" onclick="playTrack('${escStr(t.uri)}',${i})">
        <img src="${escHtml(t.art)}" alt=""
             onerror="this.style.visibility='hidden'" onload="this.style.visibility=''">
        <div class="track-row-info">
          <div class="track-row-name">${escHtml(t.name)}</div>
          <div class="track-row-artist">${escHtml(t.artists)}</div>
        </div>
        <div class="track-row-dur">${fmt(t.duration_ms)}</div>
      </div>
    `).join('');
    el('pl-back-btn').focus();
  }

  function showPlaylists() {
    el('pl-pages').style.transform = '';
    currentPlaylist = null;
    currentTracks   = [];
  }

  async function playTrack(trackUri, offset) {
    await fetch('/api/play-track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        track_uri:    trackUri,
        playlist_uri: currentPlaylist ? currentPlaylist.uri : null,
        offset,
      }),
    });
    goToPage(0);
    setTimeout(poll, 600);
  }

  async function playAll() {
    if (!currentPlaylist) return;
    const endpoint = currentPlaylist.id === '__liked__' ? '/api/play-liked' : '/api/play-playlist';
    const body     = currentPlaylist.id === '__liked__' ? {} : { playlist_id: currentPlaylist.id };
    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    goToPage(0);
    setTimeout(poll, 600);
  }

  // ── Search ─────────────────────────────────────────────────────────────────
  async function loadRecentlyPlayed() {
    try {
      const r = await fetch('/api/recently-played');
      recentlyPlayedData    = await r.json();
      recentlyPlayedLoaded  = true;
      if (currentPage === 2 && !el('search-input').value.trim()) {
        renderRecentlyPlayed(recentlyPlayedData);
      }
    } catch { /* silently ignore */ }
  }

  function renderRecentlyPlayed(items) {
    const results = el('search-results');
    if (!items || items.length === 0) {
      results.innerHTML = '<div class="search-empty">No recently played albums found.</div>';
      return;
    }
    results.innerHTML =
      '<div class="results-label">Recently Played</div>' +
      items.map(a => `
        <div class="result-album" tabindex="0" onclick="playContext('${escStr(a.album_uri)}')">
          <img src="${escHtml(a.art)}" alt=""
               onerror="this.style.visibility='hidden'" onload="this.style.visibility=''">
          <div class="result-album-info">
            <div class="result-album-name">${escHtml(a.album_name)}</div>
            <div class="result-album-artist">${escHtml(a.artists)}</div>
          </div>
        </div>
      `).join('');
  }

  let _searchTimer = null;
  function onSearchInput() {
    const q = el('search-input').value.trim();
    clearTimeout(_searchTimer);
    if (!q) {
      if (recentlyPlayedData.length > 0) {
        renderRecentlyPlayed(recentlyPlayedData);
      } else {
        el('search-results').innerHTML =
          '<div class="search-empty">Search for tracks or albums,<br>or swipe to browse playlists.</div>';
      }
      return;
    }
    el('search-results').innerHTML = '<div class="search-empty">Searching…</div>';
    _searchTimer = setTimeout(() => doSearch(q), 400);
  }

  async function doSearch(q) {
    try {
      const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const data = await r.json();
      renderSearchResults(data);
    } catch {
      el('search-results').innerHTML = '<div class="search-empty">Search failed.</div>';
    }
  }

  function renderSearchResults(data) {
    const tracks = data.tracks || [];
    const albums = data.albums || [];
    if (tracks.length === 0 && albums.length === 0) {
      el('search-results').innerHTML = '<div class="search-empty">No results found.</div>';
      return;
    }
    let html = '';
    if (tracks.length > 0) {
      html += '<div class="results-label">Tracks</div>';
      html += tracks.map(t => `
        <div class="result-track" tabindex="0" onclick="playSearchTrack('${escStr(t.uri)}')">
          <img src="${escHtml(t.art)}" alt=""
               onerror="this.style.visibility='hidden'" onload="this.style.visibility=''">
          <div class="result-track-info">
            <div class="result-track-name">${escHtml(t.name)}</div>
            <div class="result-track-artist">${escHtml(t.artists)}</div>
          </div>
        </div>
      `).join('');
    }
    if (albums.length > 0) {
      html += '<div class="results-label">Albums</div>';
      html += albums.map(a => `
        <div class="result-album" tabindex="0" onclick="playContext('${escStr(a.uri)}')">
          <img src="${escHtml(a.art)}" alt=""
               onerror="this.style.visibility='hidden'" onload="this.style.visibility=''">
          <div class="result-album-info">
            <div class="result-album-name">${escHtml(a.name)}</div>
            <div class="result-album-artist">${escHtml(a.artists)}</div>
          </div>
        </div>
      `).join('');
    }
    el('search-results').innerHTML = html;
  }

  async function playSearchTrack(uri) {
    await fetch('/api/play-track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ track_uri: uri }),
    });
    goToPage(0);
    setTimeout(poll, 600);
  }

  async function playContext(uri) {
    await fetch('/api/play-context', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ context_uri: uri }),
    });
    goToPage(0);
    setTimeout(poll, 600);
  }

  // ── Sleep/wake ─────────────────────────────────────────────────────────────
  let isSleeping = false;
  let pollTimer = null;

  async function checkSleep() {
    try {
      const r = await fetch('/api/sleep-status');
      const d = await r.json();
      return d.sleeping;
    } catch { return false; }
  }

  async function triggerWake() {
    if (!isSleeping) return;
    try { await fetch('/api/wake', { method: 'POST' }); } catch {}
    isSleeping = false;
    startPolling();
  }

  // Wake on any touch/click interaction
  document.addEventListener('touchstart', triggerWake, { once: false, passive: true });
  document.addEventListener('click', triggerWake, { once: false });

  // ── Now-playing poll ───────────────────────────────────────────────────────
  async function poll() {
    // Check sleep status periodically
    const sleeping = await checkSleep();
    if (sleeping && !isSleeping) {
      isSleeping = true;
      stopPolling();
      return;
    }
    if (isSleeping) return;

    let data;
    try {
      const r = await fetch('/api/now-playing');
      if (r.status === 401) {
        el('auth-screen').style.display = 'flex';
        el('main-ui').style.display     = 'none';
        return;
      }
      data = await r.json();
    } catch { return; }

    el('auth-screen').style.display = 'none';
    el('main-ui').style.display     = 'flex';

    playing = data.playing;
    el('play-icon').style.display  = playing ? 'none' : '';
    el('pause-icon').style.display = playing ? '' : 'none';

    // Shuffle / repeat
    shuffleState = data.shuffle || false;
    repeatState  = data.repeat  || 'off';
    updateShuffleBtn();
    updateRepeatBtn();

    clearInterval(tickTimer);
    tickTimer = null;

    if (data.track) {
      const t = data.track;
      el('track-name').textContent   = t.name    || '—';
      el('track-artist').textContent = t.artists || '—';
      el('track-album').textContent  = t.album   || '';

      const art = el('album-art');
      if (t.art && art.src !== t.art) art.src = t.art;

      progressMs = t.progress_ms;
      durationMs = t.duration_ms;
      setProgress();

      if (playing) {
        tickTimer = setInterval(() => { progressMs += 1000; setProgress(); }, 1000);
      }
    }

    if (data.volume != null) { el('vol-slider').value = data.volume; setVolBg(data.volume); }

    renderQueue(data.queue || []);
  }

  function startPolling() {
    if (pollTimer) return;
    poll();
    pollTimer = setInterval(poll, 3000);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    // Keep checking for wake every 5s while sleeping
    pollTimer = setInterval(async () => {
      const sleeping = await checkSleep();
      if (!sleeping) {
        isSleeping = false;
        clearInterval(pollTimer);
        pollTimer = null;
        startPolling();
      }
    }, 5000);
  }

  // ── Fast knob poll (volume + nav in one request) ───────────────────────────

  // ── Nav knob SSE (bypasses Wayland focus) ──────────────────────────────────
  function handleNav(action) {
    if (action === 'enter' && document.activeElement && document.activeElement.tagName === 'DIV') {
      document.activeElement.click();
      return;
    }
    if (action === 'next' || action === 'prev') {
      let container;
      if (currentPage === 1) {
        const inTracks = el('pl-pages').style.transform === 'translateX(-50%)';
        container = el(inTracks ? 'pl-tracks-view' : 'pl-list-view');
      } else {
        container = el(pageIds[currentPage]);
      }
      const inPage = [...container.querySelectorAll('button:not([disabled]), [tabindex="0"]')];
      const dots   = [...el('page-dots').querySelectorAll('[tabindex="0"]')];
      const focusable = [...inPage, ...dots];
      if (focusable.length === 0) return;
      const idx = focusable.indexOf(document.activeElement);
      if (action === 'prev') {
        if (idx > 0) focusable[idx - 1].focus();
      } else {
        if (idx < focusable.length - 1) focusable[idx + 1].focus();
      }
    }
  }

  async function pollKnobs() {
    if (isSleeping) return;
    try {
      const r = await fetch('/api/knob-poll');
      const d = await r.json();
      if (d.volume != null) { el('vol-slider').value = d.volume; setVolBg(d.volume); }
      if (d.nav) handleNav(d.nav.action);
    } catch {}
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  startPolling();
  setInterval(pollKnobs, 100);
</script>
</body>
