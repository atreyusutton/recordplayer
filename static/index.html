<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Record Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1db954;
      --bg:    #0a0a0a;
      --card:  #111111;
      --border:#1c1c1c;
      --text:  #ffffff;
      --muted: #aaaaaa;
      --dim:   #555555;
    }

    html { max-width: 100vw; overflow-x: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      height: 100dvh;
      max-width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── Auth screen ── */
    #auth-screen {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 32px;
      text-align: center;
    }
    #auth-screen h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    #auth-screen p  { color: var(--muted); font-size: 13px; line-height: 1.5; max-width: 260px; }
    #connect-btn {
      margin-top: 6px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 500px;
      padding: 12px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    #connect-btn:active { opacity: 0.85; }

    /* ── Main UI ── */
    #main-ui {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* ── Page dots ── */
    #page-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      height: 20px;
      flex-shrink: 0;
      padding-top: 4px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dim);
      cursor: pointer;
      transition: background 0.2s;
    }
    .dot.active { background: var(--green); }

    /* ── Pages outer (clips the sliding track) ── */
    #pages-outer {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    /* ── Pages track (2× wide, slides left/right) ── */
    #pages {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Individual pages ── */
    #page-player, #page-playlists {
      width: 50%;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Now playing ── */
    #now-playing {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--bg);
      flex-shrink: 0;
    }
    #album-art {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      background: #1a1a1a;
      object-fit: cover;
      flex-shrink: 0;
    }
    #track-info { flex: 1; min-width: 0; }
    #track-name {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #track-artist {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #track-album {
      font-size: 12px;
      color: var(--dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Volume (absolute, anchored to right edge of next-up) ── */
    #volume-section {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      width: 110px;
    }
    .vol-icon { color: var(--dim); flex-shrink: 0; }
    input[type=range] {
      -webkit-appearance: none;
      width: 90px;
      min-width: 0;
      height: 3px;
      border-radius: 2px;
      background: #2a2a2a;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 0;
      height: 0;
      opacity: 0;
      display: none;
    }
    input[type=range]::-moz-range-thumb {
      width: 0;
      height: 0;
      opacity: 0;
      border: none;
    }

    /* ── Progress ── */
    #progress-section {
      padding: 8px 16px 10px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #progress-track {
      width: 100%;
      height: 3px;
      background: #2a2a2a;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    #progress-track::after {
      content: '';
      position: absolute;
      inset: -8px 0;
    }
    #progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 2px;
      width: 0%;
      transition: width 1s linear;
      pointer-events: none;
    }
    #progress-times {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--dim);
      margin-top: 5px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Controls (full width, spread) ── */
    #controls {
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding: 10px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ctrl {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, transform 0.1s;
    }
    .ctrl:active { background: #222; transform: scale(0.92); }
    .ctrl.primary {
      width: 54px;
      height: 54px;
      background: var(--green);
      padding: 0;
    }
    .ctrl.primary:active { background: #18a348; }
    .ctrl svg { display: block; }

    /* ── Next Up ── */
    #next-up {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 132px 0 12px;
      flex: 1;
      min-height: 0;
      background: var(--bg);
      position: relative;
    }
    #next-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #next-art {
      width: 34px;
      height: 34px;
      border-radius: 3px;
      background: #1a1a1a;
      object-fit: cover;
      flex-shrink: 0;
    }
    #next-info { flex: 1; min-width: 0; }
    #next-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #next-artist {
      font-size: 11px;
      color: var(--dim);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Playlists page ── */
    #page-playlists {
      position: relative;
    }

    /* Inner panel: two sub-views side by side */
    #pl-pages {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #pl-list-view, #pl-tracks-view {
      width: 50%;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Playlist grid */
    #pl-list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-content: start;
    }
    #pl-list-scroll::-webkit-scrollbar { display: none; }

    .pl-card {
      background: var(--card);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      min-width: 0;
      border: 1px solid var(--border);
    }
    .pl-card:active { background: #1a1a1a; }
    .pl-card img {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      background: #1a1a1a;
    }
    .pl-card-info { flex: 1; min-width: 0; }
    .pl-card-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pl-card-count {
      font-size: 10px;
      color: var(--dim);
      margin-top: 2px;
    }

    /* Spinner */
    #pl-spinner {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dim);
      font-size: 13px;
    }

    /* Tracks view header */
    #pl-tracks-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #pl-back-btn {
      background: none;
      border: none;
      color: var(--green);
      cursor: pointer;
      padding: 4px 2px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    #pl-back-btn:active { opacity: 0.7; }
    #pl-tracks-title {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #pl-play-all-btn {
      background: var(--green);
      border: none;
      color: #fff;
      border-radius: 500px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    #pl-play-all-btn:active { background: #18a348; }

    /* Track list */
    #pl-tracks-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }
    #pl-tracks-scroll::-webkit-scrollbar { display: none; }

    .track-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .track-row:active { background: #161616; }
    .track-row img {
      width: 32px;
      height: 32px;
      border-radius: 3px;
      object-fit: cover;
      flex-shrink: 0;
      background: #1a1a1a;
    }
    .track-row-info { flex: 1; min-width: 0; }
    .track-row-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-row-artist {
      font-size: 11px;
      color: var(--dim);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-row-dur {
      font-size: 11px;
      color: var(--dim);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* Track list spinner */
    #pl-tracks-spinner {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dim);
      font-size: 13px;
    }
  </style>
</head>
<body>

<!-- Auth screen -->
<div id="auth-screen">
  <h1>Record Player</h1>
  <p>Connect your Spotify account to control playback.</p>
  <button id="connect-btn" onclick="location.href='/login'">Connect Spotify</button>
</div>

<!-- Main UI -->
<div id="main-ui">

  <!-- Page dots -->
  <div id="page-dots">
    <div class="dot active" onclick="goToPage(0)"></div>
    <div class="dot"        onclick="goToPage(1)"></div>
  </div>

  <!-- Pages outer (clips) -->
  <div id="pages-outer">
    <div id="pages">

      <!-- Page 0: Player -->
      <div id="page-player">

        <!-- Now Playing -->
        <div id="now-playing">
          <img id="album-art" src="" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility=''">
          <div id="track-info">
            <div id="track-name">—</div>
            <div id="track-artist">—</div>
            <div id="track-album"></div>
          </div>
        </div>

        <!-- Progress -->
        <div id="progress-section">
          <div id="progress-track" onclick="seek(event)">
            <div id="progress-fill"></div>
          </div>
          <div id="progress-times">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>

        <!-- Controls -->
        <div id="controls">
          <button class="ctrl" onclick="cmd('previous')" aria-label="Previous">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
            </svg>
          </button>
          <button class="ctrl primary" id="play-btn" onclick="togglePlay()" aria-label="Play/Pause">
            <svg id="play-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="pause-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>
          <button class="ctrl" onclick="cmd('next')" aria-label="Next">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/>
            </svg>
          </button>
        </div>

        <!-- Next Up -->
        <div id="next-up">
          <span id="next-label">Next</span>
          <img id="next-art" src="" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility=''">
          <div id="next-info">
            <div id="next-name">—</div>
            <div id="next-artist"></div>
          </div>
          <div id="volume-section">
            <svg class="vol-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <input type="range" id="vol-slider" min="0" max="100" value="50"
                   oninput="scheduleVolume(this.value)">
          </div>
        </div>

      </div><!-- /page-player -->

      <!-- Page 1: Playlists -->
      <div id="page-playlists">
        <div id="pl-pages">

          <!-- Sub-page: playlist list -->
          <div id="pl-list-view">
            <div id="pl-spinner">Loading playlists…</div>
            <div id="pl-list-scroll" style="display:none"></div>
          </div>

          <!-- Sub-page: tracks -->
          <div id="pl-tracks-view">
            <div id="pl-tracks-header">
              <button id="pl-back-btn" onclick="showPlaylists()" aria-label="Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
              </button>
              <div id="pl-tracks-title">Playlist</div>
              <button id="pl-play-all-btn" onclick="playAll()">▶ Play All</button>
            </div>
            <div id="pl-tracks-spinner">Loading…</div>
            <div id="pl-tracks-scroll" style="display:none"></div>
          </div>

        </div><!-- /pl-pages -->
      </div><!-- /page-playlists -->

    </div><!-- /pages -->
  </div><!-- /pages-outer -->

</div><!-- /main-ui -->

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let playing    = false;
  let progressMs = 0;
  let durationMs = 0;
  let tickTimer  = null;

  // Page state
  let currentPage      = 0;
  let playlistsLoaded  = false;
  let currentPlaylist  = null; // { id, uri, name }
  let currentTracks    = [];

  // ── Utilities ──────────────────────────────────────────────────────────────
  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function el(id) { return document.getElementById(id); }

  function setProgress() {
    if (!durationMs) return;
    const pct = Math.min(progressMs / durationMs * 100, 100);
    el('progress-fill').style.width = pct + '%';
    el('time-current').textContent  = fmt(progressMs);
    el('time-total').textContent    = fmt(durationMs);
  }

  // ── Page navigation ────────────────────────────────────────────────────────
  function goToPage(n) {
    currentPage = n;
    el('pages').style.transform = n === 0 ? '' : 'translateX(-50%)';
    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === n);
    });
    if (n === 1 && !playlistsLoaded) loadPlaylists();
  }

  // ── Swipe gesture on pages-outer ──────────────────────────────────────────
  (function() {
    const outer = el('pages-outer');
    let startX, startY, moved;
    outer.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      moved  = false;
    }, { passive: true });
    outer.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0 && currentPage === 0) goToPage(1);
        if (dx > 0 && currentPage === 1) goToPage(0);
      }
    }, { passive: true });
  })();

  // ── Playlists loading ──────────────────────────────────────────────────────
  async function loadPlaylists() {
    try {
      const r = await fetch('/api/playlists');
      const items = await r.json();
      playlistsLoaded = true;
      renderPlaylists(items);
    } catch {
      el('pl-spinner').textContent = 'Failed to load playlists.';
    }
  }

  function renderPlaylists(items) {
    const spinner = el('pl-spinner');
    const scroll  = el('pl-list-scroll');
    spinner.style.display = 'none';
    scroll.style.display  = '';
    scroll.innerHTML = items.map(p => `
      <div class="pl-card" onclick="openPlaylist('${p.id}','${escStr(p.name)}',${p.tracks})">
        <img src="${p.art || ''}" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility=''">
        <div class="pl-card-info">
          <div class="pl-card-name">${escHtml(p.name)}</div>
          <div class="pl-card-count">${p.tracks} tracks</div>
        </div>
      </div>
    `).join('');
  }

  // ── Playlist → tracks ─────────────────────────────────────────────────────
  async function openPlaylist(id, name, count) {
    currentPlaylist = { id, uri: `spotify:playlist:${id}`, name };
    el('pl-tracks-title').textContent = name;
    el('pl-tracks-spinner').style.display = '';
    el('pl-tracks-scroll').style.display  = 'none';
    el('pl-tracks-scroll').innerHTML      = '';
    // Slide inner panel to tracks view
    el('pl-pages').style.transform = 'translateX(-50%)';
    try {
      const r = await fetch(`/api/playlist/${id}/tracks`);
      currentTracks = await r.json();
      renderTracks(currentTracks);
    } catch {
      el('pl-tracks-spinner').textContent = 'Failed to load tracks.';
    }
  }

  function renderTracks(tracks) {
    const spinner = el('pl-tracks-spinner');
    const scroll  = el('pl-tracks-scroll');
    spinner.style.display = 'none';
    scroll.style.display  = '';
    scroll.innerHTML = tracks.map((t, i) => `
      <div class="track-row" onclick="playTrack('${escStr(t.uri)}',${i})">
        <img src="${t.art || ''}" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility=''">
        <div class="track-row-info">
          <div class="track-row-name">${escHtml(t.name)}</div>
          <div class="track-row-artist">${escHtml(t.artists)}</div>
        </div>
        <div class="track-row-dur">${fmt(t.duration_ms)}</div>
      </div>
    `).join('');
  }

  function showPlaylists() {
    el('pl-pages').style.transform = '';
    currentPlaylist = null;
    currentTracks   = [];
  }

  // ── Play actions ───────────────────────────────────────────────────────────
  async function playTrack(trackUri, offset) {
    await fetch('/api/play-track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        track_uri:    trackUri,
        playlist_uri: currentPlaylist ? currentPlaylist.uri : null,
        offset,
      }),
    });
    goToPage(0);
    setTimeout(poll, 600);
  }

  async function playAll() {
    if (!currentPlaylist) return;
    await fetch('/api/play-playlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playlist_id: currentPlaylist.id }),
    });
    goToPage(0);
    setTimeout(poll, 600);
  }

  // ── HTML helpers ───────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function escStr(s) {
    return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  }

  // ── Commands ───────────────────────────────────────────────────────────────
  async function cmd(action, body) {
    await fetch(`/api/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : '{}',
    });
    setTimeout(poll, 400);
  }

  function togglePlay() { cmd(playing ? 'pause' : 'play'); }

  function setVolBg(v) {
    el('vol-slider').style.background =
      `linear-gradient(to right, var(--green) ${v}%, #2a2a2a ${v}%)`;
  }

  let _volTimer = null;
  function scheduleVolume(v) {
    setVolBg(v);
    clearTimeout(_volTimer);
    _volTimer = setTimeout(() => cmd('volume', { volume: parseInt(v) }), 350);
  }

  function seek(e) {
    if (!durationMs) return;
    const rect  = e.currentTarget.getBoundingClientRect();
    const pct   = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const posMs = Math.floor(pct * durationMs);
    progressMs  = posMs;
    setProgress();
    cmd('seek', { position_ms: posMs });
  }

  // ── Now-playing poll ───────────────────────────────────────────────────────
  async function poll() {
    let data;
    try {
      const r = await fetch('/api/now-playing');
      if (r.status === 401) {
        el('auth-screen').style.display = 'flex';
        el('main-ui').style.display     = 'none';
        return;
      }
      data = await r.json();
    } catch { return; }

    el('auth-screen').style.display = 'none';
    el('main-ui').style.display     = 'flex';

    playing = data.playing;
    el('play-icon').style.display  = playing ? 'none' : '';
    el('pause-icon').style.display = playing ? '' : 'none';

    clearInterval(tickTimer);
    tickTimer = null;

    if (data.track) {
      const t = data.track;
      el('track-name').textContent   = t.name    || '—';
      el('track-artist').textContent = t.artists || '—';
      el('track-album').textContent  = t.album   || '';

      const art = el('album-art');
      if (t.art && art.src !== t.art) art.src = t.art;

      progressMs = t.progress_ms;
      durationMs = t.duration_ms;
      setProgress();

      if (playing) {
        tickTimer = setInterval(() => { progressMs += 1000; setProgress(); }, 1000);
      }
    }

    if (data.volume != null) { el('vol-slider').value = data.volume; setVolBg(data.volume); }

    // Next up
    const n = data.next_track;
    const nextUp = el('next-up');
    if (n) {
      el('next-name').textContent   = n.name    || '—';
      el('next-artist').textContent = n.artists || '';
      const nextArt = el('next-art');
      if (n.art && nextArt.src !== n.art) nextArt.src = n.art;
      nextUp.style.visibility = '';
    } else {
      nextUp.style.visibility = 'hidden';
    }
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  poll();
  setInterval(poll, 3000);
</script>
</body>
</html>
